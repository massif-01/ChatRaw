<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="ChatRaw - A minimalist, fast, and powerful AI chat interface with multi-model support, plugin marketplace, and advanced features like RAG and thinking mode.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ChatRaw</title>
    <link rel="icon" id="favicon" href="data:,">
    
    <!-- Performance: Preload Critical Resources -->
    <link rel="preload" href="fonts/remixicon/remixicon.woff2?t=1769685282643" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="styles.min.css?v=8.0" as="style">
    <link rel="preload" href="app.min.js?v=8.0" as="script">
    <link rel="preload" href="vendor/alpinejs/3.13.3/alpine.min.js" as="script">
    <link rel="preload" href="vendor/marked/9.1.6/marked.min.js" as="script">
    
    <!-- Critical CSS: Inline for faster first paint -->
    <style>
        /* RemixIcon - Inline to avoid render blocking */
        @font-face{font-family:"remixicon";src:url('fonts/remixicon/remixicon.woff2?t=1769685282643') format("woff2"),url('fonts/remixicon/remixicon.woff?t=1769685282643') format("woff");font-display:swap}
        [class^="ri-"],[class*=" ri-"]{font-family:'remixicon'!important;font-style:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
        .ri-add-line:before{content:"\ea13"}.ri-arrow-down-s-line:before{content:"\ea4e"}.ri-arrow-left-s-line:before{content:"\ea64"}.ri-arrow-right-s-line:before{content:"\ea6e"}.ri-close-circle-fill:before{content:"\eb96"}.ri-close-line:before{content:"\eb99"}.ri-computer-line:before{content:"\ebca"}.ri-delete-bin-line:before{content:"\ec2a"}.ri-error-warning-line:before{content:"\eca1"}.ri-external-link-line:before{content:"\ecaf"}.ri-file-text-line:before{content:"\ed0f"}.ri-flashlight-line:before{content:"\ed3d"}.ri-image-line:before{content:"\ee4b"}.ri-lightbulb-line:before{content:"\eea9"}.ri-link:before{content:"\eeb2"}.ri-loader-4-line:before{content:"\eec6"}.ri-menu-line:before{content:"\ef3e"}.ri-message-3-line:before{content:"\ef46"}.ri-robot-2-line:before{content:"\f3d8"}.ri-send-plane-2-line:before{content:"\f0d8"}.ri-settings-3-line:before{content:"\f0e6"}.ri-stop-circle-line:before{content:"\f19f"}.ri-tools-line:before{content:"\f21b"}.ri-upload-2-line:before{content:"\f24a"}.ri-user-3-line:before{content:"\f256"}.ri-file-copy-line:before{content:"\ecd5"}.ri-check-line:before{content:"\eb7b"}.ri-information-line:before{content:"\ee59"}.ri-download-2-line:before{content:"\ec54"}.ri-search-line:before{content:"\f0d1"}
        
        :root {
            --background: 0 0% 100%;
            --foreground: 0 0% 0%;
            --muted: 0 0% 94.1%;
            --muted-foreground: 0 0% 40%;
            --accent: 0 0% 95.3%;
            --border: 0 0% 89.8%;
            --ring: 0 0% 0%;
            --destructive: 0 84.2% 60.2%;
            --success: 142.1 76.2% 36.3%;
            --bg-primary: hsl(var(--background));
            --bg-secondary: #f9f9f9;
            --bg-tertiary: hsl(var(--muted));
            --bg-hover: hsl(var(--accent));
            --text-primary: hsl(var(--foreground));
            --text-secondary: hsl(var(--muted-foreground));
            --text-muted: #6b6b6b;
            --border-color: hsl(var(--border));
            --border-focus: hsl(var(--foreground));
            --accent-color: hsl(var(--foreground));
            --on-accent: hsl(var(--background));
            --success-color: hsl(var(--success));
            --error-color: hsl(var(--destructive));
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            --font-mono: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-normal: 200ms;
            --transition: all var(--duration-normal) var(--ease);
        }
        [data-theme="dark"] {
            --background: 0 0% 0%;
            --foreground: 0 0% 100%;
            --muted: 0 0% 8.6%;
            --muted-foreground: 0 0% 62.7%;
            --accent: 0 0% 10.2%;
            --border: 0 0% 15.7%;
            --bg-secondary: #0a0a0a;
            --text-muted: #737373;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; height: 100dvh; overflow: hidden; }
        body {
            height: 100%; height: -webkit-fill-available; height: 100dvh;
            overflow: hidden;
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            line-height: 1.6;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        [x-cloak] { display: none !important; }
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100%;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            flex-shrink: 0;
        }
        .sidebar.collapsed { width: 72px; min-width: 72px; }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .welcome h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        @media (max-width: 768px), (max-height: 500px) and (max-width: 900px) and (pointer: coarse) {
            .sidebar { position: fixed; left: 0; top: 0; transform: translateX(0); }
            .sidebar.collapsed { transform: translateX(-100%); }
        }
    </style>
    
    <!-- Vendor scripts: register Collapse before Alpine starts -->
    <script src="vendor/marked/9.1.6/marked.min.js"></script>
    <script defer src="vendor/collapse/3.13.3/collapse.min.js"></script>
    <script defer src="vendor/alpinejs/3.13.3/alpine.min.js"></script>
    <!-- highlight.js is lazy-loaded in app.min.js when needed -->
    <link rel="stylesheet" href="fonts/remixicon/remixicon.css">
    <link rel="stylesheet" href="styles.min.css?v=8.0">
</head>
<body x-data="app()" :data-theme="settings.ui_settings.theme_mode">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" x-show="isMobileView && !sidebarCollapsed" @click="closeSidebar()" x-transition:enter="fade-enter" x-transition:leave="fade-leave"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" :class="{ 'collapsed': sidebarCollapsed }">
        <div class="sidebar-header">
            <div class="logo" x-show="!sidebarCollapsed">
                <img x-show="settings.ui_settings.logo_data" :src="settings.ui_settings.logo_data" alt="Logo" class="logo-img" width="32" height="32">
                <span class="logo-text" x-text="settings.ui_settings.logo_text || 'JustChat'"></span>
            </div>
            <button class="btn-icon" @click="toggleSidebar()" :title="sidebarCollapsed ? t('expand') : t('collapse')" :aria-expanded="String(!sidebarCollapsed)" aria-label="Toggle sidebar">
                <i class="ri-arrow-left-s-line" x-show="!sidebarCollapsed"></i>
                <i class="ri-arrow-right-s-line" x-show="sidebarCollapsed"></i>
            </button>
        </div>
        
        <button class="btn-new-chat" @click="createNewChat()" x-show="!sidebarCollapsed">
            <i class="ri-add-line"></i>
            <span x-text="t('newChat')"></span>
        </button>
        
        <button class="btn-new-chat-collapsed" @click="createNewChat()" x-show="sidebarCollapsed" :title="t('newChat')" :aria-label="t('newChat')">
            <i class="ri-add-line"></i>
        </button>

        <div class="chat-list" x-show="!sidebarCollapsed">
            <template x-for="chat in chats" :key="chat.id">
                <div class="chat-item" :class="{ 'active': currentChatId === chat.id }">
                    <button type="button" class="chat-select" @click="selectChat(chat.id)" :aria-current="currentChatId === chat.id ? 'true' : null">
                        <i class="ri-message-3-line" aria-hidden="true"></i>
                        <span class="chat-title" x-text="chat.title"></span>
                    </button>
                    <button class="btn-delete" @click="deleteChat(chat.id)" :title="t('delete')" :aria-label="t('delete') + ' ' + chat.title">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </template>
        </div>
        
        <button class="btn-clear-all" x-show="!sidebarCollapsed && chats.length > 0" @click="clearAllChats()" :title="t('clearAllChats')">
            <i class="ri-delete-bin-line"></i>
            <span x-text="t('clearAllChats')"></span>
        </button>

        <div class="sidebar-footer" x-show="!sidebarCollapsed">
            <button class="btn-plugins" @click="openPluginsPanel()">
                <i class="ri-tools-line"></i>
                <span x-text="t('plugins')"></span>
            </button>
            <button class="btn-settings" @click="openSettingsPanel()">
                <i class="ri-settings-3-line"></i>
                <span x-text="t('settings')"></span>
            </button>
        </div>
        
        <button class="btn-icon sidebar-plugins-collapsed" @click="openPluginsPanel()" x-show="sidebarCollapsed" :title="t('plugins')">
            <i class="ri-tools-line"></i>
        </button>
        <button class="btn-icon sidebar-settings-collapsed" @click="openSettingsPanel()" x-show="sidebarCollapsed" :title="t('settings')">
            <i class="ri-settings-3-line"></i>
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Mobile Header -->
        <div class="mobile-header" x-show="isMobileView">
            <button class="btn-icon" @click="openSidebar()" :aria-label="at('openChats')">
                <i class="ri-menu-line"></i>
            </button>
            <span class="mobile-title">ChatRaw</span>
        </div>

        <div class="chat-container">
            <!-- Welcome - Pre-rendered for LCP optimization -->
            <div class="welcome" x-show="messages.length === 0">
                <div class="welcome-logo">
                    <img x-show="settings.ui_settings.logo_data" :src="settings.ui_settings.logo_data" alt="Logo" class="welcome-logo-img" width="80" height="80">
                </div>
                <h1 x-text="settings.ui_settings.logo_text || 'ChatRaw'">ChatRaw</h1>
                <p class="welcome-subtitle" x-text="settings.ui_settings.subtitle || t('defaultSubtitle')">Your minimalist AI assistant</p>
                
                <div class="welcome-features">
                    <div class="feature">
                        <i class="ri-flashlight-line"></i>
                        <span x-text="t('fastResponse')">Fast Response</span>
                    </div>
                    <div class="feature">
                        <i class="ri-tools-line"></i>
                        <span x-text="t('pluginMarket')">Plugin Market</span>
                    </div>
                    <div class="feature">
                        <i class="ri-computer-line"></i>
                        <span x-text="t('multiModel')">Multi-Model</span>
                    </div>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages" x-show="messages.length > 0" x-ref="messagesContainer" @scroll.passive="trackOutputScroll($event)">
                <template x-for="(msg, index) in messages" :key="msg.id || (msg.run_id ? msg.role + msg.run_id : index)">
                    <div class="message" :class="msg.role">
                        <div class="message-avatar" :class="msg.role">
                            <!-- User avatar -->
                            <img x-show="msg.role === 'user' && settings.ui_settings.user_avatar" :src="settings.ui_settings.user_avatar" alt="User" width="36" height="36" class="avatar-img">
                            <i class="ri-user-3-line" x-show="msg.role === 'user' && !settings.ui_settings.user_avatar"></i>
                            <!-- AI avatar -->
                            <img x-show="msg.role === 'assistant' && settings.ui_settings.assistant_avatar" :src="settings.ui_settings.assistant_avatar" alt="AI" width="36" height="36" class="avatar-img">
                            <i class="ri-robot-2-line" x-show="msg.role === 'assistant' && !settings.ui_settings.assistant_avatar"></i>
                        </div>
                        <div class="message-content">
                            <!-- Show typing indicator for empty assistant message while generating -->
                            <div class="typing-indicator" x-show="Boolean(msg.role === 'assistant' && !msg.content && msg.streaming)">
                                <span></span><span></span><span></span>
                            </div>
                            <!-- Thinking/Reasoning Block -->
                            <div class="thinking-block" x-show="Boolean(msg.thinking && msg.thinking.length > 0)">
                                <div class="thinking-header" @click="msg.showThinking = !msg.showThinking" role="button" :aria-expanded="msg.showThinking">
                                    <i class="ri-lightbulb-line"></i>
                                    <span x-text="t('thinkingProcess')"></span>
                                    <i class="ri-arrow-down-s-line chevron" :class="{ 'expanded': msg.showThinking }"></i>
                                </div>
                                <div class="thinking-content" x-show="msg.showThinking" x-collapse>
                                    <div x-html="renderMarkdown(msg.thinking)"></div>
                                </div>
                            </div>

                            <div class="message-markdown" x-show="Boolean(messageText(msg))"
                                 x-effect="renderMessage($el, messageText(msg), messageLive(msg), !!getMessageRun(msg)?.replaying)"></div>

                            <ul class="agent-attachments sent-attachments" x-show="Boolean(msg.role === 'user' && msg.attachments?.length)" :aria-label="at('attachments')">
                                <template x-for="file in msg.attachments || []" :key="file.attachment_id">
                                    <li><i class="ri-attachment-2" aria-hidden="true"></i><span x-text="file.name"></span></li>
                                </template>
                            </ul>

                            <template x-if="msg.role === 'assistant' && msg.run_id">
                                <section class="agent-activity" :aria-label="at('run')">
                                    <template x-for="run in [getMessageRun(msg)].filter(Boolean)" :key="run.id">
                                        <div>
                                            <div class="agent-status" role="status">
                                                <i class="ri-loader-4-line spin" x-show="run.connecting" aria-hidden="true"></i>
                                                <span x-text="run.status ? at(run.status) : at('checking')"></span>
                                                <span x-show="Boolean(run.reason)" x-text="run.reason"></span>
                                                <span x-show="run.disconnected" x-text="at('reconnecting')"></span>
                                            </div>
                                            <p class="agent-error" x-show="Boolean(run.error)" x-text="run.error"></p>
                                            <template x-for="item in run.interactions.filter(item => item.open)" :key="item.data.interaction_id">
                                                <button type="button" class="agent-request" @click="openAgentInteraction(run, item)">
                                                    <i :class="item.data.kind === 'approval' ? 'ri-shield-check-line' : 'ri-question-line'" aria-hidden="true"></i>
                                                    <span>
                                                        <strong x-text="item.data.title"></strong>
                                                        <small x-text="interactionStatus(item) || at(item.data.presentation === 'plan' ? 'plan' : item.data.kind)"></small>
                                                    </span>
                                                    <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
                                                </button>
                                            </template>
                                            <ul class="agent-artifacts" x-show="Boolean(run.artifacts.length)" :aria-label="at('artifacts')">
                                                <template x-for="file in run.artifacts" :key="file.artifact_id">
                                                    <li>
                                                        <a :href="artifactUrl(file.artifact_id)" :download="file.name">
                                                            <i class="ri-download-2-line" aria-hidden="true"></i>
                                                            <span x-text="file.name"></span>
                                                        </a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                    <details class="agent-run-details" @toggle="openRunDetails($event, msg.run_id)">
                                        <summary x-text="at('details')"></summary>
                                        <template x-for="run in [getMessageRun(msg)].filter(Boolean)" :key="run.id">
                                            <div class="agent-details-body">
                                                <div class="agent-reasoning" x-show="Boolean(run.reasoning)">
                                                    <strong x-text="t('thinkingProcess')"></strong>
                                                    <pre x-text="run.reasoning"></pre>
                                                </div>
                                                <template x-for="tool in run.tools" :key="tool.tool_call_id">
                                                    <div class="agent-tool">
                                                        <strong x-text="tool.title || tool.name"></strong>
                                                        <small x-text="[tool.status && at(tool.status), Number.isFinite(tool.duration_ms) ? tool.duration_ms + ' ms' : ''].filter(Boolean).join(' · ')"></small>
                                                        <pre x-show="Boolean(tool.input_preview)" x-text="tool.input_preview"></pre>
                                                        <pre x-show="Boolean(tool.output_preview)" x-text="tool.output_preview"></pre>
                                                    </div>
                                                </template>
                                                <template x-for="item in run.interactions.filter(item => !item.open)" :key="item.data.interaction_id">
                                                    <button type="button" class="agent-request" @click="openAgentInteraction(run, item)">
                                                        <span>
                                                            <strong x-text="item.data.title"></strong>
                                                            <small x-text="interactionStatus(item)"></small>
                                                        </span>
                                                        <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
                                                    </button>
                                                </template>
                                                <dl class="agent-facts" x-show="Boolean(run.usage)">
                                                    <dt x-show="run.usage?.input_tokens != null" x-text="at('inputTokens')"></dt>
                                                    <dd x-show="run.usage?.input_tokens != null" x-text="run.usage?.input_tokens"></dd>
                                                    <dt x-show="run.usage?.output_tokens != null" x-text="at('outputTokens')"></dt>
                                                    <dd x-show="run.usage?.output_tokens != null" x-text="run.usage?.output_tokens"></dd>
                                                    <dt x-show="run.usage?.cost != null" x-text="at('cost')"></dt>
                                                    <dd x-show="run.usage?.cost != null" x-text="[run.usage?.cost, run.usage?.currency].filter(value => value != null).join(' ')"></dd>
                                                </dl>
                                            </div>
                                        </template>
                                    </details>
                                </section>
                            </template>

                            <!-- Message Actions (assistant only) -->
                            <div class="message-actions" x-show="Boolean(msg.role === 'assistant' && messageText(msg) && !messageLive(msg))">
                                <button class="btn-copy"
                                        @click="copyMessage(messageText(msg), $event)"
                                        :title="t('copyMessage')" :aria-label="t('copyMessage')">
                                    <i class="ri-file-copy-line"></i>
                                </button>
                                <div class="message-actions-plugin-slot" :data-msg-index="index"></div>
                            </div>
                            
                            <!-- RAG References -->
                            <div class="rag-references" x-show="Boolean(msg.references && msg.references.length > 0)">
                                <div class="rag-references-header" @click="msg.showRefs = !msg.showRefs" role="button" :aria-expanded="msg.showRefs">
                                    <i class="ri-file-text-line"></i>
                                    <span x-text="t('ragReferences') + ' (' + (msg.references?.length || 0) + ')'"></span>
                                    <i class="ri-arrow-down-s-line chevron" :class="{ 'expanded': msg.showRefs }"></i>
                                </div>
                                <div class="rag-references-list" x-show="msg.showRefs" x-collapse>
                                    <template x-for="(ref, refIdx) in msg.references" :key="refIdx">
                                        <div class="rag-reference-item">
                                            <div class="ref-header">
                                                <span class="ref-badge" x-text="'#' + (refIdx + 1)"></span>
                                                <span class="ref-score" x-text="t('relevance') + ': ' + (ref.score * 100).toFixed(0) + '%'"></span>
                                            </div>
                                            <div class="ref-content" x-text="ref.content.length > 200 ? ref.content.substring(0, 200) + '...' : ref.content"></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                
                <div class="message assistant" x-show="isGenerating && (!messages.length || messages[messages.length-1].role !== 'assistant')">
                    <div class="message-avatar assistant">
                        <img x-show="settings.ui_settings.assistant_avatar" :src="settings.ui_settings.assistant_avatar" alt="AI" width="36" height="36" class="avatar-img">
                        <i class="ri-robot-2-line" x-show="!settings.ui_settings.assistant_avatar"></i>
                    </div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container-inner">
                    <div class="uploaded-image-preview" x-show="Boolean(!agentId && uploadedImage && chatModelSupportsVision())">
                        <img :src="uploadedImage ? 'data:image/jpeg;base64,' + uploadedImageBase64 : ''" alt="Preview" width="60" height="60">
                        <button class="btn-delete-overlay" @click="removeUploadedImage()" aria-label="Remove image"><i class="ri-close-circle-fill"></i></button>
                    </div>
                    
                    <!-- Parsed URL Preview -->
                    <div class="parsed-url-preview" x-show="Boolean(!agentId && parsedUrl)" x-cloak>
                        <i class="ri-link"></i>
                        <span class="parsed-url-title" x-text="parsedUrlTitle"></span>
                        <button class="btn-remove-url" @click="removeParsedUrl()" aria-label="Remove URL"><i class="ri-close-circle-fill"></i></button>
                    </div>
                    
                    <!-- Attached Document Preview -->
                    <div class="attached-doc-preview" x-show="Boolean(!agentId && attachedDocument)" x-cloak>
                        <i class="ri-file-text-line"></i>
                        <span class="attached-doc-name" x-text="attachedDocument?.filename"></span>
                        <button class="btn-remove-doc" @click="removeAttachedDocument()" aria-label="Remove document"><i class="ri-close-circle-fill"></i></button>
                    </div>

                    <!-- URL Input Popup -->
                    <div class="url-input-popup" x-show="!agentId && showUrlInput" x-cloak @click.outside="cancelUrlInput()">
                        <div class="url-input-header" x-text="t('enterUrl')"></div>
                        <input
                            type="text"
                            x-model="urlInputValue"
                            :placeholder="t('urlPlaceholder')"
                            @keydown.enter="parseUrl()"
                            @keydown.escape="cancelUrlInput()"
                            :disabled="isParsingUrl"
                        >
                        <div class="url-input-actions">
                            <button class="btn-cancel" @click="cancelUrlInput()" x-text="t('cancel')"></button>
                            <button class="btn-confirm" @click="parseUrl()" :disabled="isParsingUrl || !urlInputValue.trim()">
                                <span x-show="!isParsingUrl" x-text="t('confirm')"></span>
                                <span x-show="isParsingUrl" x-text="t('parsing')"></span>
                            </button>
                        </div>
                    </div>

                              (agentBinding?.active_run_id ? at('busy') : agentInfo?.reason || at('noReady')))"></span>

                        <button type="button" class="btn-secondary" x-show="Boolean(agentBindingError)"
                                @click="selectChat(currentChatId, true)" x-text="t('retry')"></button>

                    <ul class="agent-attachments" x-show="Boolean(agentId && agentAttachments.length)" :aria-label="at('attachments')" x-cloak>

                                <i class="ri-attachment-2" aria-hidden="true"></i>
                                <span x-text="file.name"></span>
                                <button type="button" class="btn-icon" :aria-label="at('remove') + ' ' + file.name"

                                </button>
                            </li>
                        </template>
                    </ul>

                    <div class="input-wrapper" @click.outside="closeCompletionMenu()">

                             x-show="completionMenuOpen"
                             x-cloak
                             x-transition
                             role="listbox"
                             aria-label="Composer suggestions"
                             @mousedown.prevent>
                            <template x-for="(item, index) in completionItems" :key="item.providerId + ':' + item.id">
                                <button type="button"
                                        class="composer-suggestion-item"
                                        role="option"
                                        :class="{ 'active': index === completionActiveIndex }"
                                        :aria-selected="index === completionActiveIndex"
                                        @mouseenter="completionActiveIndex = index"
                                        @click="acceptCompletion(item)">
                                    <i :class="item.icon || 'ri-command-line'"></i>
                                    <span class="composer-suggestion-main">
                                        <span class="composer-suggestion-label" x-text="getLocalizedText(item.label, item.id)"></span>
                                        <span class="composer-suggestion-desc" x-text="getLocalizedText(item.description, item.source || '')"></span>
                                    </span>
                                    <span class="composer-suggestion-source" x-text="item.source || ''"></span>
                                </button>
                            </template>
                        </div>

                        <div class="composer-highlight"
                             x-ref="composerHighlight"
                             x-html="renderComposerHighlights(inputMessage)"
                             aria-hidden="true"></div>

                        <textarea 
                            x-model="inputMessage" 
                            @keydown="handleComposerKeydown($event)"
                            :placeholder="t('inputPlaceholder')"
                            rows="1"
                            x-ref="inputBox"
                            @input="handleComposerInput($event)"
                            @scroll="syncComposerHighlightScroll($event)"
                            @click="queueCompletionRefresh()"
                            @focus="queueCompletionRefresh()"
                            @compositionstart="handleCompositionStart()"
                            @compositionend="handleCompositionEnd($event)"
                        ></textarea>
                        
                        <div class="agent-mode" @click.outside="closeAgentMenu()" @keydown.escape.stop="closeAgentMenu(true)">

                                    :title="agentBinding?.workspace?.label || at('agentMode')"
                                    :disabled="agentViewLoading || agentMenuBusy || isGenerating" aria-controls="agent-mode-panel">
                                <i :class="agentId ? 'ri-terminal-box-line' : 'ri-chat-3-line'" aria-hidden="true"></i>
                                <span x-text="agentButtonName(agentId)"></span>
                                <i class="ri-arrow-up-s-line" aria-hidden="true"></i>

                                        <input type="radio" name="agent-mode" value="" x-model="agentMenuChoice">
                                        <span x-text="at('ordinary')"></span>
                                    </label>
                                    <template x-for="agent in selectableAgents" :key="agent.id">
                                        <label class="agent-option">
                                            <input type="radio" name="agent-mode" :value="agent.id" x-model="agentMenuChoice">
                                            <span>
                                                <span x-text="agentName(agent.id)"></span>
                                                <small x-show="agent.availability !== 'ready'" x-text="agent.reason || at(agent.availability)"></small>
                                            </span>
                                        </label>
                                    </template>
                                    <p class="agent-error" x-show="Boolean(agentCatalogError)" x-text="agentCatalogError"></p>

                                    <select class="input-minimal" x-model="agentProjectChoice">
                                        <option value="" x-text="at('managed')"></option>
                                        <template x-for="project in agentWorkspaces" :key="project.id">
                                            <option :value="project.id" x-text="project.label"></option>
                                        </template>
                                    </select>
                                    <small class="agent-error" x-show="Boolean(agentWorkspaceError)" x-text="agentWorkspaceError"></small>
                                </label>
                                <div class="agent-menu-actions">
                                    <button type="button" class="btn-secondary" @click="closeAgentMenu(); openPluginsPanel()" x-text="at('agentPlugins')"></button>
                                    <button type="button" class="btn-primary" @click="applyAgentMode()"

                                </div>
                                <div class="agent-compact-action" x-show="Boolean(agentId)">
                                    <button type="button" class="btn-secondary" @click="closeAgentMenu(true); sendAgentRun('compact')"
                                            :disabled="agentBlocked" x-text="at('compact')"></button>
                                    <small x-show="!agentInfo?.capabilities?.compact" x-text="at('noCompact')"></small>
                                </div>
                            </div>
                        </div>

                        <div class="input-toolbar">
                            <button type="button" class="btn-tool" x-show="Boolean(agentId && (agentInfo?.capabilities?.images || agentInfo?.capabilities?.files))"

                            </button>
                            <input type="file" hidden multiple x-ref="agentFileInput" @change="uploadAgentAttachments($event)"
                                   :accept="agentAttachmentAccept">
                            <!-- Thinking Mode Toggle -->
                            <div class="thinking-toggle" x-show="!agentId" :class="{ 'active': useThinking }" @click="useThinking = !useThinking" :title="t('thinkingMode')">
                                <i class="ri-lightbulb-line"></i>
                                <div class="thinking-slider">
                                    <div class="thinking-slider-handle"></div>
                                </div>
                            </div>
                            <template x-if="!agentId && chatModelSupportsVision()">
                                <label class="btn-tool btn-tool-upload" :title="t('uploadImage')">
                                    <input type="file" @change="handleImageUpload($event)" accept="image/*" class="file-input-hidden">
                                    <i class="ri-image-line"></i>
                                </label>
                            </template>
                            <label class="btn-tool btn-tool-upload" x-show="!agentId" :title="t('uploadDocument')" :class="{ 'active': attachedDocument }">
                                <input type="file" @change="handleDocumentUpload($event)" :accept="getDocumentAcceptTypes()" class="file-input-hidden" :disabled="isUploadingDocument">
                                <i class="ri-file-text-line" x-show="!isUploadingDocument"></i>
                                <i class="ri-loader-4-line spin" x-show="isUploadingDocument"></i>
                            </label>
                            <button class="btn-tool" x-show="!agentId" @click="toggleUrlInput()" :title="t('parseUrl')" :class="{ 'active': parsedUrl }">
                                <i class="ri-link"></i>
                            </button>
                            
                            <!-- Plugin Toolbar Buttons Extension Area -->
                            <div class="plugin-toolbar-area" x-show="Boolean(visiblePluginButtons.length || hiddenPluginButtons.length)" x-cloak>
                                <div class="plugin-toolbar-divider"></div>
                                
                                <!-- Visible buttons (max 5) -->
                                <template x-for="btn in visiblePluginButtons" :key="btn.fullId">
                                    <button 
                                        class="btn-tool plugin-btn" 
                                        :class="{ 'active': btn.active, 'loading': btn.loading }"
                                        :title="getPluginButtonLabel(btn)"
                                        @click="handlePluginButtonClick(btn)"
                                        :disabled="btn.loading">
                                        <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon"></i>
                                    </button>
                                </template>
                                
                                <button type="button" class="btn-tool" x-show="Boolean(hiddenPluginButtons.length)"
                                        @click="showPluginMoreMenu = !showPluginMoreMenu; closeAgentMenu()"
                                        :aria-label="t('plugins')" :aria-expanded="showPluginMoreMenu">
                                    <i class="ri-more-2-fill" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="plugin-more-menu composer-plugin-menu" x-show="showPluginMoreMenu" x-cloak
                             @click.outside="showPluginMoreMenu = false" @keydown.escape.stop="showPluginMoreMenu = false">
                            <template x-for="btn in hiddenPluginButtons" :key="btn.fullId">
                                <button type="button" class="plugin-more-item" :class="{ active: btn.active }"
                                        :disabled="btn.loading" @click="handlePluginButtonClick(btn); showPluginMoreMenu = false">
                                    <i :class="btn.loading ? 'ri-loader-4-line spin' : btn.icon" aria-hidden="true"></i>
                                    <span x-text="getPluginButtonLabel(btn)"></span>
                                </button>
                            </template>
                        </div>

                        <!-- Send Button -->
                        <button class="btn-send" x-show="!isGenerating && !showAgentStop" @click="sendMessage()" :disabled="!canSendMessage" :aria-label="t('send')">
                            <i class="ri-send-plane-2-line"></i>
                        </button>
                        <!-- Stop Button -->
                        <button class="btn-stop" x-show="isGenerating || showAgentStop"

                                :title="t('stopGeneration')" :aria-label="t('stopGeneration')">
                            <i class="ri-stop-circle-line"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" x-show="toast.show" x-text="toast.message" :class="toast.type" role="status"></div>
    </main>

    <!-- New Settings Modal -->

                                    <div class="model-status" :class="model.status || 'unknown'">
                                        <span x-show="model.status === 'success'" class="status-success" x-text="'● ' + t('active')"></span>
                                        <span x-show="model.status === 'error'" class="status-error" x-text="'● ' + t('error')"></span>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">API Endpoint</label>
                                    <input type="text" class="input-minimal" x-model="model.api_url">
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">API Key (Optional)</label>
                                    <input type="password" class="input-minimal" x-model="model.api_key">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Model ID</label>
                                    <input type="text" class="input-minimal" x-model="model.model_id">

                                <div class="form-group" x-show="model.type === 'chat'">

                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" x-model="model.capability.reasoning"> <span x-text="t('reasoning')"></span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" x-model="model.capability.tools"> <span x-text="t('tools')"></span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="form-group" x-show="model.type === 'chat'">

                                </div>

                            </div>
                        </template>
                    </div>

                        <!-- Plugin Grid -->
                        <div class="plugin-grid" x-show="!pluginMarketLoading && !pluginMarketError">
                            <template x-for="plugin in filteredMarketPlugins" :key="plugin.id">
                                <div class="plugin-card plugin-card-market" x-data="{ infoOpen: false }" @click.outside="infoOpen = false">
                                    <img :src="getMarketPluginIconUrl(plugin)"
                                         class="plugin-icon plugin-icon-market" 
                                         width="36" height="36"
                                         @error="handleMarketPluginIconError($event, plugin)">
                                    <div class="plugin-card-market-body">
                                        <span class="plugin-name plugin-name-market" x-text="plugin.name[lang] || plugin.name.en"></span>
                                    </div>
                                    <div class="plugin-actions plugin-actions-market">
                                        <div class="plugin-info-wrap">
                                            <button class="btn-icon btn-icon-sm" 
                                                    @click="infoOpen = !infoOpen"
                                                    :aria-expanded="infoOpen"
                                                    aria-label="Plugin info">
                                                <i class="ri-information-line"></i>
                                            </button>
                                            <div class="plugin-info-popover" x-show="infoOpen" x-cloak x-transition>
                                                <div class="plugin-info-popover-title" x-text="plugin.name[lang] || plugin.name.en"></div>
                                                <div class="plugin-info-popover-version" x-text="'v' + plugin.version"></div>
                                                <div class="plugin-info-popover-desc" x-text="plugin.description[lang] || plugin.description.en"></div>
                                            </div>
                                        </div>
                                        <button class="btn-icon btn-icon-sm" 
                                                @click="installPlugin(plugin)" 
                                                :disabled="(isPluginInstalled(plugin.id) && !canUpdateBundledPlugin(plugin)) || pluginInstalling === plugin.id"
                                                :title="pluginInstalling === plugin.id ? t('installing') : (canUpdateBundledPlugin(plugin) ? at('updatePlugin') : isPluginInstalled(plugin.id) ? t('installed') : t('install'))"
                                                :aria-label="canUpdateBundledPlugin(plugin) ? at('updatePlugin') : 'Install plugin'">
                                            <i class="ri-loader-4-line spin" x-show="pluginInstalling === plugin.id"></i>
                                            <i class="ri-refresh-line" x-show="canUpdateBundledPlugin(plugin) && pluginInstalling !== plugin.id"></i>
                                            <i class="ri-check-line" x-show="isPluginInstalled(plugin.id) && !canUpdateBundledPlugin(plugin) && pluginInstalling !== plugin.id"></i>
                                            <i class="ri-download-2-line" x-show="!isPluginInstalled(plugin.id) && pluginInstalling !== plugin.id"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="filteredMarketPlugins.length === 0" class="plugin-empty" x-text="t('noPluginsAvailable')"></div>
                        </div>
                    </div>
                    
                    <!-- Installed Plugins Tab -->
                    <div x-show="pluginTab === 'installed'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('installedPlugins')"></h2>
                            <p class="section-desc" x-text="t('installedPluginsDesc')"></p>
                        </div>
                        
                        <div class="plugin-grid" x-show="installedPlugins.length > 0">
                            <template x-for="plugin in installedPlugins" :key="plugin.id">
                                <div class="plugin-card plugin-card-market" x-data="{ infoOpen: false }" @click.outside="infoOpen = false">
                                    <img :src="'/api/plugins/' + encodeURIComponent(plugin.id) + '/icon'" 
                                         class="plugin-icon plugin-icon-market"
                                         width="36" height="36"
                                         @error="$el.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23666%22 stroke-width=%222%22><path d=%22M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z%22/></svg>'">
                                    <div class="plugin-card-market-body">
                                        <span class="plugin-name plugin-name-market" x-text="plugin.name?.[lang] || plugin.name?.en || plugin.name || plugin.id"></span>
                                    </div>
                                    <div class="plugin-actions plugin-actions-market">
                                        <div class="plugin-info-wrap">
                                            <button class="btn-icon btn-icon-sm" 
                                                    @click="infoOpen = !infoOpen"
                                                    :aria-expanded="infoOpen"
                                                    aria-label="Plugin info">
                                                <i class="ri-information-line"></i>
                                            </button>
                                            <div class="plugin-info-popover" x-show="infoOpen" x-cloak x-transition>
                                                <div class="plugin-info-popover-title" x-text="plugin.name?.[lang] || plugin.name?.en || plugin.name || plugin.id"></div>
                                                <div class="plugin-info-popover-version" x-text="'v' + (plugin.version || '1.0.0')"></div>
                                                <div class="plugin-info-popover-desc" x-text="plugin.description?.[lang] || plugin.description?.en || ''"></div>
                                            </div>
                                        </div>
                                        <button class="btn-icon btn-icon-sm" @click="openPluginSettings(plugin)" :title="t('settings')">
                                            <i class="ri-settings-3-line"></i>
                                        </button>
                                        <button class="btn-icon btn-icon-sm btn-icon-danger" @click="uninstallPlugin(plugin)" :title="t('uninstall')">
                                            <i class="ri-delete-bin-line"></i>
                                        </button>
                                        <button role="switch" :aria-checked="plugin.enabled" class="toggle-switch" :class="{ 'checked': plugin.enabled }" @click="togglePlugin(plugin)">
                                            <span class="toggle-handle"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="installedPlugins.length === 0" class="plugin-empty" x-text="t('noPluginsInstalled')"></div>
                        </div>
                    </div>
                    
                    <!-- Install Local Plugin Tab -->
                    <div x-show="pluginTab === 'local'">
                        <div class="section-header">
                            <h2 class="section-title" x-text="t('installLocalPlugin')"></h2>
                            <p class="section-desc" x-text="t('installLocalPluginDesc')"></p>
                        </div>
                        
                        <div class="upload-area plugin-upload" @click="$refs.pluginFileInput.click()"
                            @dragover.prevent @drop.prevent="handlePluginDrop($event)">
                            <input type="file" x-ref="pluginFileInput" @change="handlePluginUpload($event)" accept=".zip" class="file-input-hidden">
                            <i class="ri-upload-2-line icon-xl"></i>
                            <div x-text="t('selectPluginZip')"></div>
                        </div>
                        
                        <!-- Upload progress -->
                        <div class="plugin-upload-progress" x-show="pluginUploading">
                            <div class="spinner"></div>
                            <span x-text="t('installing')"></span>
                        </div>
                        
                        <div class="plugin-dev-guide">
                            <a href="https://github.com/massif-01/ChatRaw/blob/main/Plugins/README.md" target="_blank" rel="noopener">
                                <i class="ri-external-link-line"></i>
                                <span x-text="t('pluginDevGuide')"></span>
                            </a>
                        </div>
                    </div>
                    
                </div>
                
                <!-- Modal Actions Footer -->
                <div class="modal-actions-bar">
                    <button class="btn-secondary" @click="showPlugins = false" x-text="t('close')"></button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Plugin Settings Modal -->
    <div class="modal-overlay" x-show="showPluginSettings" x-cloak @click.self="showPluginSettings = false"
         @keydown.escape.window="showPluginSettings && (showPluginSettings = false)" x-transition
         role="dialog" aria-modal="true" aria-labelledby="plugin-settings-title">
        <div class="plugin-settings-modal" :class="{ 'custom-settings-modal': currentPluginSettings?.customSettings }">
            <div class="plugin-settings-header" x-show="!currentPluginSettings?.customSettings">
                <h3 id="plugin-settings-title" x-text="currentPluginSettings?.name?.[lang] || currentPluginSettings?.name?.en || currentPluginSettings?.id || ''"></h3>
            </div>
            <div class="plugin-settings-content" :class="{ 'custom-settings-content': currentPluginSettings?.customSettings }">
                <!-- Custom Settings Container (for plugins with customSettings: true) -->
                <template x-if="currentPluginSettings?.customSettings">
                    <div id="plugin-custom-settings-area" class="plugin-custom-settings">
                        <div class="plugin-loading-text">Loading...</div>
                    </div>
                </template>
                
                <template x-if="currentPluginSettings?.agent">
                    <section class="agent-health">
                        <p x-text="at('hostSettings')"></p>
                        <button type="button" class="btn-secondary" @click="checkAgentHealth(currentPluginSettings.id)"
                                :disabled="agentChecking" x-text="at(agentChecking ? 'checking' : 'check')"></button>
                        <form id="agent-settings-fields" @submit.prevent="saveAgentSettings()">
                            <p x-show="agentSettingsLoading" role="status" x-text="at('checking')"></p>
                            <p x-show="!agentSettingsLoading && agentSettingsSchema && !agentSettingFields.length"
                               x-text="at('noEditableSettings')"></p>
                            <div x-show="!agentSettingsLoading && !agentSettingsSchema">
                                <p class="agent-error" x-text="at('settingsUnavailable')"></p>
                                <button type="button" class="btn-secondary" @click="openAgentSettings(currentPluginSettings)" x-text="t('retry')"></button>
                            </div>
                            <template x-for="field in agentSettingsLoading ? [] : agentSettingFields" :key="field.name">
                                <label class="form-group agent-setting-field">
                                    <span class="form-label" x-text="field.title || at(field.name)"></span>
                                    <small x-show="Boolean(field.description)" x-text="field.description"></small>
                                    <template x-if="field.enum || field.type === 'boolean'">
                                        <select class="input-minimal" x-model="agentSettingValues[field.name]" :required="field.required">
                                            <option value="" x-text="at('nativeDefault')"></option>
                                            <template x-for="value in (field.enum || [true, false])" :key="JSON.stringify(value)">
                                                <option :value="JSON.stringify(value)" x-text="String(value)"></option>
                                            </template>
                                        </select>
                                    </template>
                                    <template x-if="!field.enum && field.type === 'string'">
                                        <input type="text" class="input-minimal" :required="field.required"
                                               :minlength="field.minLength ?? null" :maxlength="field.maxLength ?? null" :pattern="field.pattern ?? null"
                                               :list="field.name === 'model' && agentModelSuggestions.length ? 'agent-model-options' : null"
                                               :placeholder="String(field.default ?? at('nativeDefault'))" x-model="agentSettingValues[field.name]">
                                    </template>
                                    <template x-if="!field.enum && (field.type === 'number' || field.type === 'integer')">
                                        <input type="number" class="input-minimal" :required="field.required"
                                               :min="field.minimum ?? null" :max="field.maximum ?? null" :step="field.type === 'integer' ? 1 : 'any'"
                                               :placeholder="String(field.default ?? at('nativeDefault'))" x-model="agentSettingValues[field.name]">
                                    </template>
                                </label>
                            </template>
                            <datalist id="agent-model-options">
                                <template x-for="model in agentModelSuggestions" :key="model.id">
                                    <option :value="model.id" :label="model.label"></option>
                                </template>
                            </datalist>
                            <p class="agent-error" role="status" x-show="Boolean(agentSettingsError)" x-text="agentSettingsError"></p>
                        </form>
                        <p class="agent-error" role="status" x-show="Boolean(agentHealthError)" x-text="agentHealthError"></p>
                        <div x-show="Boolean(agentHealth)" role="status">
                            <strong x-text="[agentHealth && at(agentHealth.availability), agentHealth?.version].filter(Boolean).join(' · ')"></strong>
                            <p x-text="agentHealth?.reason"></p>
                            <dl class="agent-facts">
                                <template x-for="name in ['program', 'protocol', 'authentication', 'model_request']" :key="name">
                                    <div>
                                        <dt x-text="at(name)"></dt>
                                        <dd x-text="at(agentHealth?.checks?.[name] || 'not_checked')"></dd>
                                    </div>
                                </template>
                            </dl>
                        </div>
                    </section>
                </template>

                <!-- Standard Settings (only when no customSettings) -->
                <template x-if="!currentPluginSettings?.agent && !currentPluginSettings?.customSettings && currentPluginSettings?.settings?.length > 0">
                    <div>
                        <template x-for="setting in currentPluginSettings.settings" :key="setting.id">
                            <div class="form-group">
                                <label class="form-label" x-text="setting.label?.[lang] || setting.label?.en || setting.id"></label>
                                
                                <!-- Boolean -->
                                <template x-if="setting.type === 'boolean'">
                                    <button role="switch" :aria-checked="pluginSettingsValues[setting.id]" class="toggle-switch" :class="{ 'checked': pluginSettingsValues[setting.id] }" 
                                         @click="pluginSettingsValues[setting.id] = !pluginSettingsValues[setting.id]">
                                        <span class="toggle-handle"></span>
                                    </button>
                                </template>
                                
                                <!-- String -->
                                <template x-if="setting.type === 'string'">
                                    <input type="text" class="input-minimal" 
                                           x-model="pluginSettingsValues[setting.id]" 
                                           :placeholder="String(setting.default || '')">
                                </template>
                                
                                <!-- Number -->
                                <template x-if="setting.type === 'number'">
                                    <input type="number" class="input-minimal" 
                                           x-model.number="pluginSettingsValues[setting.id]"
                                           :min="setting.min" :max="setting.max"
                                           :placeholder="String(setting.default || '')">
                                </template>
                                
                                <!-- Select -->
                                <template x-if="setting.type === 'select'">
                                    <select class="input-minimal" x-model="pluginSettingsValues[setting.id]">
                                        <template x-for="(opt, idx) in (setting.options || [])" :key="setting.id + '-' + idx">
                                            <option :value="(typeof opt === 'object' && opt && 'value' in opt) ? opt.value : opt" x-text="(typeof opt === 'object' && opt && 'label' in opt) ? getLocalizedText(opt.label, String(opt.value)) : opt"></option>
                                        </template>
                                    </select>
                                </template>
                                
                                <!-- Password -->
                                <template x-if="setting.type === 'password'">
                                    <input type="password" class="input-minimal" 
                                           x-model="pluginSettingsValues[setting.id]"
                                           placeholder="••••••••">
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                
                <!-- No Settings (only when no customSettings AND no standard settings) -->
                <template x-if="!currentPluginSettings?.customSettings && !currentPluginSettings?.agent && (!currentPluginSettings?.settings || currentPluginSettings.settings.length === 0)">
                    <div class="plugin-no-settings" x-text="t('noPluginSettings')"></div>
                </template>
                
                <!-- Proxy/API Key settings (only for non-custom settings plugins) -->
                <template x-if="!currentPluginSettings?.agent && !currentPluginSettings?.customSettings && currentPluginSettings && currentPluginSettings.proxy && currentPluginSettings.proxy.length > 0">
                    <div class="plugin-proxy-settings">
                        <h4 x-text="t('apiKeySettings')"></h4>
                        <template x-for="proxy in currentPluginSettings.proxy" :key="proxy.id">
                            <div class="form-group">
                                <label class="form-label" x-text="proxy.name?.[lang] || proxy.name?.en || proxy.id"></label>
                                <p class="form-sublabel" x-text="proxy.description?.[lang] || proxy.description?.en || ''"></p>
                                <input type="text" class="input-minimal" 
                                       x-model="pluginApiKeys[proxy.id]"
                                       :placeholder="pluginApiKeys[proxy.id] ? '' : t('enterApiKey')"
                                       @focus="if(pluginApiKeys[proxy.id]?.includes('*')) pluginApiKeys[proxy.id] = ''">
                                <p class="form-hint" x-show="pluginApiKeys[proxy.id]?.includes('*')" x-text="t('apiKeySet')"></p>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            <div class="plugin-settings-footer" x-show="!currentPluginSettings?.customSettings">
                <button class="btn-secondary" @click="showPluginSettings = false" x-text="t('cancel')"></button>
                <button class="btn-primary" x-show="!currentPluginSettings?.agent" @click="savePluginSettings()" x-text="t('save')"></button>
                <button type="submit" form="agent-settings-fields" class="btn-primary" x-show="Boolean(currentPluginSettings?.agent && agentSettingFields.length)"
                        :disabled="agentSettingsLoading || agentSettingsSaving" x-text="t('save')"></button>
            </div>
        </div>
    </div>

    <dialog class="agent-dialog" x-ref="agentDialog" aria-labelledby="agent-dialog-title"
            @close="if (!$event.target.open) agentInteraction = null">
        <template x-for="entry in agentInteraction ? [agentInteraction] : []" :key="entry.interaction.data.interaction_id">
            <form class="agent-dialog-form" @submit.prevent="submitAgentInteraction(entry.run, entry.interaction)">
                <header class="agent-dialog-header">
                    <div>
                        <small x-text="at(entry.interaction.data.presentation === 'plan' ? 'plan' : entry.interaction.data.kind)"></small>
                        <h2 id="agent-dialog-title" x-text="entry.interaction.data.title"></h2>
                    </div>
                    <button type="button" class="btn-icon" @click="closeAgentInteraction()" :aria-label="t('close')" autofocus>
                        <i class="ri-close-line" aria-hidden="true"></i>
                    </button>
                </header>
                <div class="agent-dialog-body">
                    <div class="agent-plan" x-show="Boolean(entry.interaction.data.detail)" x-html="renderMarkdown(entry.interaction.data.detail)"></div>
                    <dl class="agent-facts" x-show="Boolean(entry.interaction.data.operation)">
                        <dt x-show="Boolean(entry.interaction.data.operation?.tool)" x-text="at('tool')"></dt>
                        <dd x-show="Boolean(entry.interaction.data.operation?.tool)" x-text="entry.interaction.data.operation?.tool"></dd>
                        <dt x-show="Boolean(entry.interaction.data.operation?.cwd_label)" x-text="at('workspace')"></dt>
                        <dd x-show="Boolean(entry.interaction.data.operation?.cwd_label)" x-text="entry.interaction.data.operation?.cwd_label"></dd>
                        <dt x-show="Boolean(entry.interaction.data.operation?.host_label)" x-text="at('host')"></dt>
                        <dd x-show="Boolean(entry.interaction.data.operation?.host_label)" x-text="entry.interaction.data.operation?.host_label"></dd>
                        <dt x-show="Boolean(entry.interaction.data.operation?.paths?.length)" x-text="at('paths')"></dt>
                        <dd x-show="Boolean(entry.interaction.data.operation?.paths?.length)"><pre x-text="entry.interaction.data.operation?.paths?.join('\n')"></pre></dd>
                        <dt x-show="Boolean(entry.interaction.data.operation?.command)" x-text="at('command')"></dt>
                        <dd x-show="Boolean(entry.interaction.data.operation?.command)"><pre x-text="entry.interaction.data.operation?.command"></pre></dd>
                    </dl>

                    <fieldset class="agent-options" x-show="entry.interaction.data.kind === 'approval'"
                              :disabled="!interactionActionable(entry.run, entry.interaction)">
                        <legend x-text="at('decision')"></legend>
                        <template x-for="choice in entry.interaction.data.decisions || []" :key="choice.id">
                            <label class="agent-option">
                                <input type="radio" name="agent-decision" :value="choice.id" x-model="entry.interaction.decision">
                                <span>
                                    <span x-text="choice.label"></span>
                                    <small x-show="Boolean(choice.scope)" x-text="choice.scope"></small>
                                </span>
                            </label>
                        </template>
                    </fieldset>

                    <template x-for="question in entry.interaction.data.questions || []" :key="question.id">
                        <fieldset class="agent-options" :disabled="!interactionActionable(entry.run, entry.interaction)">
                            <legend x-text="question.text"></legend>
                            <template x-for="choice in question.options || []" :key="choice.id">
                                <label class="agent-option">
                                    <input :type="question.type === 'single' ? 'radio' : 'checkbox'" :name="'question-' + question.id"
                                           :checked="questionAnswer(entry.interaction, question.id).option_ids.includes(choice.id)"
                                           @change="selectQuestionOption(entry.interaction, question, choice.id, $event.target.checked)">
                                    <span>
                                        <span x-text="choice.label"></span>
                                        <small x-show="Boolean(choice.description)" x-text="choice.description"></small>
                                        <small x-show="Boolean(choice.recommended)" x-text="at('recommended')"></small>
                                    </span>
                                </label>
                            </template>
                            <template x-if="question.type !== 'text' && question.allow_custom">
                                <label class="agent-option">
                                    <input :type="question.type === 'single' ? 'radio' : 'checkbox'" :name="'question-' + question.id"
                                           :checked="questionAnswer(entry.interaction, question.id).custom"
                                           @change="selectQuestionCustom(entry.interaction, question, $event.target.checked)">
                                    <span x-text="at('custom')"></span>
                                </label>
                            </template>
                            <textarea class="input-minimal agent-answer" rows="3"
                                      x-show="question.type === 'text' || questionAnswer(entry.interaction, question.id).custom"
                                      :aria-label="question.text" x-model="questionAnswer(entry.interaction, question.id).text"></textarea>
                        </fieldset>
                    </template>

                    <p class="agent-interaction-status" role="status" x-show="Boolean(interactionStatus(entry.interaction, entry.run))" x-text="interactionStatus(entry.interaction, entry.run)"></p>
                    <p x-show="Boolean(entry.interaction.answerSummary)" x-text="entry.interaction.answerSummary"></p>
                </div>
                <footer class="agent-dialog-actions">
                    <button type="button" class="btn-secondary" x-show="Boolean(entry.interaction.data.allow_cancel)"
                            @click="submitAgentInteraction(entry.run, entry.interaction, true)"
                            :disabled="!interactionActionable(entry.run, entry.interaction)" x-text="at('cancelRequest')"></button>
                    <button type="submit" class="btn-primary" :disabled="!interactionActionable(entry.run, entry.interaction) || !interactionReply(entry.interaction)"
                            x-text="at('submit')"></button>
                </footer>
            </form>
        </template>
    </dialog>

    <!-- Plugin Fullscreen Modal -->
    <div class="modal-overlay plugin-fullscreen-modal" 
         x-show="pluginFullscreenModal.show" 
         x-cloak
         x-transition
         @click.self="pluginFullscreenModal.closable && closePluginFullscreenModal()"
         @keydown.escape.window="pluginFullscreenModal.show && pluginFullscreenModal.closable && closePluginFullscreenModal()">
        <div class="plugin-fullscreen-content" x-html="pluginFullscreenModal.content"></div>
    </div>

    <script>
        if (document.documentMode) {
            document.body.textContent = 'ChatRaw does not support Internet Explorer. Use Chrome 109 or later. / ChatRaw 不支持 Internet Explorer，请使用 Chrome 109 或更新版本。';
        }
    </script>
    <script>
        if (document.documentMode) {
            document.body.textContent = 'ChatRaw does not support Internet Explorer. Use Chrome 109 or later. / ChatRaw 不支持 Internet Explorer，请使用 Chrome 109 或更新版本。';
        }
    </script>
    <script src="stream-markdown.js?v=1"></script>
    <script src="agents.js?v=1"></script>
    <script src="app.min.js?v=8.0"></script>
</body>
</html>
