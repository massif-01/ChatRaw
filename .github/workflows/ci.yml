name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**/*.py'
      - 'backend/requirements.txt'
      - 'backend/static/**'
      - 'agent_runner/**'
      - 'Plugins/**'
      - 'deploy/**'
      - 'script/agent_db_backup.py'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  agent-runner:
    name: Agent Runner Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Runner dependencies
        run: pip install -r agent_runner/requirements.txt
      - name: Check interactive installer safety
        run: |
          bash -n deploy/setup-new.sh deploy/setup-existing.sh
          python -m unittest discover -s deploy -p test_setup.py -v
      - name: Run protocol and persistence tests
        # Native CLI/model tests are opt-in and have separate field evidence.
        run: python -m unittest discover -s agent_runner/tests -t . -v

  code-check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt flake8

      - name: Get changed Python files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py' 'backend/**/*.py' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Syntax check
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -n "$FILES" ]; then
            for f in $FILES; do
              if [ -f "$f" ]; then
                python -m py_compile "$f" || exit 1
              fi
            done
          fi

      - name: Flake8 (critical errors only)
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -n "$FILES" ]; then
            flake8 --select=E9,F63,F7,F82 $FILES || exit 1
          fi

      - name: Module import test
        run: |
          cd backend
          python -c "from main import app"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [code-check, agent-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chatraw:test .

      - name: Smoke test
        run: docker run --rm chatraw:test python -c "print('✅ Docker OK')"

      - name: Interactive installation and reuse smoke test
        timeout-minutes: 10
        run: bash deploy/test_setup_linux.sh

      - name: Installer service diagnostics
        if: failure()
        run: |
          sudo journalctl -u chatraw-runner --no-pager -n 60 || true
          docker logs --tail=60 chatraw || true
